<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Safety Slogan Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <div class="card">

            <div class="header top-band">
                <img src="./logo2.png" class="logo">
                <div>
                    <h1>Road Safety Slogan Generator</h1>
                    <p>Create campaign-ready slogan visuals instantly</p>
                </div>
            </div>

            <div class="controls">
                <img class="signal" src="./traffic_signal.jpg">
                <input type="text" id="employeeCode" maxlength="6" inputmode="numeric" placeholder="6 Digit Employee Code">
                <input type="text" id="slogan" placeholder="Your Slogan Here">
                <!-- <button id="generateBtn" onclick="generateImage(); downloadImage()">Generate & Download</button> -->
                <button id="generateBtn" onclick="handleGenerateDownload()">Generate & Download</button>
            </div>

            <div class="divider"></div>

            <div class="preview">
                <h3>Live Preview :</h3>
                <div class="preview-box">
                    <!-- Canvas Preview -->
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    <script src="script2.js"></script>
</body>

</html>
